<section class="modulex-sss-terim-sozluk{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sss-terim-sozluk-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* sss-terim-sozluk — sss-dizin numaralı soru dizini + kart, sss-kategori-blok yapışkan grup başlığı + akordeon kullanır; bu modül sözlük (dl) iskeleti — terim kelimesi maddenin başlığıdır, çip bulutu terimle süzer/vurgular (çapa yedekli), cevaplar hep açık. */
  .modulex-sss-terim-sozluk { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sss-terim-sozluk *, .modulex-sss-terim-sozluk *::before, .modulex-sss-terim-sozluk *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sss-terim-sozluk :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sss-terim-sozluk :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sss-terim-sozluk :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sss-terim-sozluk :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sss-terim-sozluk img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sss-terim-sozluk) img { height: auto; }
  .modulex-sss-terim-sozluk [hidden] { display: none !important; }
  .modulex-sss-terim-sozluk :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sss-terim-sozluk :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sss-terim-sozluk-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sss-terim-sozluk-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sss-terim-sozluk--bassiz .modulex-sss-terim-sozluk-bas { display: none; }
  .modulex-sss-terim-sozluk-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sss-terim-sozluk-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sss-terim-sozluk-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sss-terim-sozluk-bas { max-width: 760px; }
  .modulex-sss-terim-sozluk-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sss-terim-sozluk-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sss-terim-sozluk-dugme:hover { transform: translateY(-2px); }
  .modulex-sss-terim-sozluk-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sss-terim-sozluk-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sss-terim-sozluk-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sss-terim-sozluk-terimler { position: sticky; inset-block-start: 72px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-block-end: 26px; padding: 12px; border-radius: --yuvarlak--; background: color-mix(in srgb, --bg-- 94%, transparent); box-shadow: 0 0 0 1px --cizgi--, 0 14px 30px -26px color-mix(in srgb, --text-- 55%, transparent); backdrop-filter: blur(8px); }
  .modulex-sss-terim-sozluk-terim { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 14px; border-radius: 8px; background: --kartBg--; color: --text--; font-family: var(--mx-font-serif, Georgia, serif); font-style: italic; font-weight: 600; text-decoration: none; transition: background-color 0.2s ease, color 0.2s ease; }
  .modulex-sss-terim-sozluk-terim:hover { color: --accentInk--; }
  .modulex-sss-terim-sozluk-terim[aria-current="true"] { background: --vurguBg--; color: --vurguText--; }
  .modulex-sss-terim-sozluk-tsay { font-family: var(--mx-font-sans, inherit); font-size: 0.74rem; font-style: normal; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-sss-terim-sozluk-sozluk { display: grid; margin: 0; }
  .modulex-sss-terim-sozluk-madde { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr); gap: clamp(14px, 4vw, 48px); padding: 24px 16px; border-block-start: 1px dotted --cizgi--; border-radius: 6px; scroll-margin-block-start: 150px; transition: opacity 0.3s ease, background-color 0.3s ease; }
  .modulex-sss-terim-sozluk-madde:last-child { border-block-end: 1px dotted --cizgi--; }
  .modulex-sss-terim-sozluk-madde:target, .modulex-sss-terim-sozluk-madde.modulex-sss-terim-sozluk--secili { background-color: color-mix(in srgb, --accent-- 8%, --bg--); }
  .modulex-sss-terim-sozluk-madde.modulex-sss-terim-sozluk--soluk { opacity: 0.4; }
  .modulex-sss-terim-sozluk-madde:focus { outline: none; }
  .modulex-sss-terim-sozluk-dt { display: grid; align-content: start; gap: 4px; }
  .modulex-sss-terim-sozluk-kelime { color: --accentInk--; font-family: var(--mx-font-serif, Georgia, serif); font-size: clamp(1.35rem, 2.4vw, 1.8rem); font-style: italic; font-weight: 600; line-height: 1.2; }
  .modulex-sss-terim-sozluk-no { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; font-variant-numeric: tabular-nums; }
  .modulex-sss-terim-sozluk-dd { display: grid; gap: 8px; margin: 0; }
  .modulex-sss-terim-sozluk-soru { font-size: 1.12rem; font-weight: 750; line-height: 1.4; }
  .modulex-sss-terim-sozluk-cevap { color: --muted--; line-height: 1.75; }
  @media (max-width: 768px) {
    .modulex-sss-terim-sozluk-terimler { flex-wrap: nowrap; overflow-x: auto; inset-block-start: 60px; scrollbar-width: none; }
    .modulex-sss-terim-sozluk-terim { flex: none; }
    .modulex-sss-terim-sozluk-madde { grid-template-columns: minmax(0, 1fr); gap: 6px; padding-inline: 10px; }
    .modulex-sss-terim-sozluk-dt { grid-auto-flow: column; justify-content: start; align-items: baseline; gap: 12px; }
  }
  .modulex-sss-terim-sozluk-bag { display: inline-flex; align-items: center; gap: 6px; margin-block-start: 10px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.25s ease; }
  .modulex-sss-terim-sozluk-bag:hover { gap: 10px; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-sss-terim-sozluk-bag .material-symbols-outlined { font-size: 18px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-terim-sozluk :is(.modulex-sss-terim-sozluk-baslik, .modulex-sss-terim-sozluk-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-terim-sozluk-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sss-terim-sozluk { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sss-terim-sozluk *, .modulex-sss-terim-sozluk *::before, .modulex-sss-terim-sozluk *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sss-terim-sozluk";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const terimSec = (s, P, az) => {
        const cip = [...s.querySelectorAll("[data-terim]")];
        const madde = [...s.querySelectorAll("[data-madde]")];
        if (!cip.length) return;
        s.classList.add(P + "--tjs");
        let secili = "";
        const sec = (t, kaydir) => {
          secili = secili === t ? "" : t;
          cip.forEach((c) => { if (c.dataset.terim === secili) c.setAttribute("aria-current", "true"); else c.removeAttribute("aria-current"); });
          madde.forEach((m) => {
            m.classList.toggle(P + "--secili", !!secili && m.dataset.madde === secili);
            m.classList.toggle(P + "--soluk", !!secili && m.dataset.madde !== secili);
          });
          const ilk = madde.find((m) => secili && m.dataset.madde === secili);
          if (ilk && kaydir) {
            ilk.scrollIntoView({ behavior: az ? "auto" : "smooth", block: "nearest" });
            ilk.focus({ preventScroll: true });
          }
        };
        cip.forEach((c) => c.addEventListener("click", (e) => { e.preventDefault(); sec(c.dataset.terim, true); }));
        s.addEventListener("keydown", (e) => { if (e.key === "Escape" && secili) sec(secili, false); });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      terimSec(s, P, az);
    });
  })();
</script>
