<script>
  (() => {
    const P = "modulex-sayac-doner-vitrin";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    const vitrin = (s, P) => {
        const tb = s.querySelector("[data-vitrin-tabla]");
        const d = s.querySelector("[data-vitrin-denetim]");
        const t = tb ? [...tb.querySelectorAll("[data-vitrin-tas]")] : [];
        if (t.length < 2 || !d) return;
        const sec = [...d.querySelectorAll("[data-vitrin-sec]")];
        const ok = [...d.querySelectorAll("[data-vitrin-git]")];
        const konum = d.querySelector("[data-vitrin-no]");
        const n = t.length;
        const mod = (v) => ((v % n) + n) % n;
        const ad = (j) => { const e = t[j].querySelector("[data-vitrin-ad]"); return e ? e.textContent.trim() : String(j + 1); };
        const iki = (v) => String(v).padStart(2, "0");
        let adim = 0;
        s.classList.add(P + "--vjs");
        d.hidden = false;
        const kur = (yeni) => {
          adim = mod(yeni);
          const i = adim;
          tb.style.setProperty("--adim", String(adim));
          t.forEach((x, j) => { const on = j === i; x.classList.toggle(P + "-tas--on", on); x.inert = !on; x.setAttribute("aria-hidden", String(!on)); });
          if (konum) konum.textContent = `${iki(i + 1)} / ${iki(n)}`;
          ok.forEach((b) => b.setAttribute("aria-label", ad(mod(i + Number(b.dataset.vitrinGit)))));
          sec.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
        };
        ok.forEach((b) => b.addEventListener("click", () => kur(adim + Number(b.dataset.vitrinGit))));
        sec.forEach((b, j) => b.addEventListener("click", () => kur(j)));
        d.addEventListener("keydown", (e) => {
          const rtl = getComputedStyle(s).direction === "rtl";
          if (e.key === (rtl ? "ArrowLeft" : "ArrowRight")) { e.preventDefault(); kur(adim + 1); }
          else if (e.key === (rtl ? "ArrowRight" : "ArrowLeft")) { e.preventDefault(); kur(adim - 1); }
        });
        kur(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sayac(s, P, az);
      vitrin(s, P, az);
    });
  })();
</script>
